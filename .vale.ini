# Prose linting. Run `vale sync` once to download packages, then `pnpm lint:prose`.
# Spelling is checked by cspell (en-GB + de-CH), so Vale.Spelling is off everywhere.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Blog
Packages = proselint, write-good

[formats]
mdx = md

# English (en-GB)
[{src/content/blog/en/**,src/content/pages/en/**}/*.{md,mdx}]
BasedOnStyles = Vale, House, proselint, write-good
Vale.Spelling = NO
write-good.E-Prime = NO
write-good.Passive = suggestion
write-good.TooWordy = suggestion

[social/**/*.en.md]
BasedOnStyles = Vale, House, proselint
Vale.Spelling = NO

# German (de-CH)
[{src/content/blog/de/**,src/content/pages/de/**}/*.{md,mdx}]
BasedOnStyles = HouseDE

[social/**/*.de.md]
BasedOnStyles = HouseDE
