name: Correction
description: Report a factual error, broken link or typo in an article.
title: 'Correction: '
labels: [correction]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL of the article.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong?
      description: Quote the passage and explain the problem.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Link to a source that supports the correction, if you have one.
