# Link checker config. `pnpm lint:links` checks the built site in dist/.
# Site-internal links start with the base path /ai-tech-blog/; the script passes --root-dir
# (must be absolute) and the remap strips the base path so they resolve inside dist/.
remap = ["^file://(.*)/dist/ai-tech-blog/(.*)$ file://$1/dist/$2"]
index_files = ["index.html"]
max_retries = 3
retry_wait_time = 4
timeout = 20
max_concurrency = 16
accept = ["200..=299", "403", "429"]
exclude_path = ["_astro"]
exclude = [
  "^https?://localhost",
  "^https?://(www\\.)?linkedin\\.com",
  "^https://gc\\.zgo\\.at",
  "^https://giscus\\.app/client\\.js",
  "^https://github\\.com/markus-tobler/ai-tech-blog/issues/new",
  "^https://markus-tobler\\.github\\.io",
  "^https://fonts\\.(googleapis|gstatic)\\.com",
]
